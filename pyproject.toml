[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archviz"
version = "0.1.0"
description = "AI-assisted diagram compiler and local-first visual editor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DiagramC contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "jsonschema>=4.23,<5",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/sightdev00/diagramc"
Documentation = "https://github.com/sightdev00/diagramc#readme"
Repository = "https://github.com/sightdev00/diagramc"
Issues = "https://github.com/sightdev00/diagramc/issues"

[project.scripts]
archviz = "archviz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archviz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
