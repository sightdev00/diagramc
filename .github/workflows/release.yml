name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c "import os, pathlib, re; version = re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1); tag = os.environ['RELEASE_TAG']; assert tag == 'v' + version, f'tag {tag} must match pyproject version v{version}'"
      - run: python -m build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/diagramc
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          docker build --tag "$IMAGE:${VERSION#v}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${VERSION#v}"
          docker push "$IMAGE:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --generate-notes --title "DiagramC ${RELEASE_TAG#v}"
